name = "aintegration-kb-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

# KV binding name must be KB (matches dashboard binding).
# If deploying via Wrangler, replace id with your KV namespace id from the dashboard.
[[kv_namespaces]]
binding = "KB"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
